name: Streaming JSON Record Services

on:
  push:
    paths:
      - '.github/workflows/streaming-json-record-services.yml'
      - 'nifi-commons/nifi-record/**'
      - 'nifi-extension-bundles/nifi-kafka-bundle/nifi-kafka-processors/**'
      - 'nifi-extension-bundles/nifi-standard-services/nifi-record-serialization-service-api/**'
      - 'nifi-extension-bundles/nifi-streaming-json-record-services-bundle/**'
  pull_request:
    paths:
      - '.github/workflows/streaming-json-record-services.yml'
      - 'nifi-commons/nifi-record/**'
      - 'nifi-extension-bundles/nifi-kafka-bundle/nifi-kafka-processors/**'
      - 'nifi-extension-bundles/nifi-standard-services/nifi-record-serialization-service-api/**'
      - 'nifi-extension-bundles/nifi-streaming-json-record-services-bundle/**'

permissions:
  contents: read

jobs:
  stock-nifi-2-10:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: nifi-extension-bundles/nifi-streaming-json-record-services-bundle
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Verify stock NAR and release archive
        run: >-
          ./mvnw -B -ntp -Pstock,release -Dnifi.version=2.10.0
          -Dstreaming.json.source.revision=${{ github.sha }}
          -Dbuild.iteration=ci-stock-2.10.0-release clean verify
      - name: Verify stock processor compatibility
        run: >-
          ./mvnw -B -ntp -Pprocessor-compatibility -Dnifi.version=2.10.0
          -Dbuild.iteration=ci-stock-2.10.0-processors clean verify

  enhanced-current-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Verify enhanced processor compatibility
        run: >-
          ./mvnw -B -ntp -Pprocessor-compatibility-enhanced
          -pl :nifi-streaming-json-record-services-processor-tests -am
          -Dbuild.iteration=ci-enhanced-processors verify
